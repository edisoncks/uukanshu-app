name: release

# Official releases ONLY, built on CI — never from a laptop.
#
# Two entry points, one pipeline (test -> build -> verify the updater contract
# and the official signature -> publish):
#
# - Finals: push an ANNOTATED `vX.Y.Z` tag whose message is the Traditional
#   Chinese changelog. Only numeric tags wake CI; a suffix tag matches the glob
#   but is skipped by the job guard, so a stray beta tag cannot publish itself.
# - Prereleases (`X.Y.Z-rc.N`, `X.Y.Z-beta`): dispatch this workflow with the
#   version. It creates the annotated tag from
#   `docs/release-notes/v<version>.md` and publishes with `--prerelease
#   --latest=false`, so `/releases/latest` keeps pointing at the last final.
#   See docs/RELEASING.md § Publishing a prerelease.
on:
  push:
    # NOTE: tag filters are globs, not regexes — `.` is a literal dot here.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease version, e.g. 1.2.28-rc.1 (must match versionName and carry a suffix)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Finals arrive as a numeric tag push. Prereleases are dispatched by hand and
    # their version input must carry a suffix (checked in the first step).
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # A hung run should fail in minutes, not burn 6h of bills by default.
    timeout-minutes: 45
    # Holds KEYSTORE_BASE64 + key passwords. Give it required reviewers so
    # every official release needs a human tap before anything is signed.
    environment: production
    env:
      # Official production-key SHA-256 cert fingerprint (public value).
      # Rotate here when the production key rotates.
      EXPECTED_FINGERPRINT: f8e0e346ce994463c85313d22e471b5b5377f06ac4db84e4b89fed331d0273c0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Resolves the tag both paths publish under. On dispatch the tag is created
      # here: a suffix tag pushed by hand would be skipped by the guard above, and
      # the changelog must be a reviewed file rather than retyped at publish time.
      - name: Resolve release identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            exit 0
          fi
          test -n "$VERSION" || { echo "inputs.version is required"; exit 1; }
          case "$VERSION" in
            *-*) ;;
            *) echo "workflow_dispatch publishes prereleases only; got '$VERSION'"; exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" \
            || { echo "dispatched on $GITHUB_REF_NAME; run it on the default branch"; exit 1; }
          TAG="v$VERSION"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")" \
            || { echo "tag $TAG already exists; published assets are never overwritten"; exit 1; }
          NOTES="docs/release-notes/$TAG.md"
          test -s "$NOTES" || { echo "missing changelog $NOTES"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -F "$NOTES"
          git push origin "refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v5

      - name: Install Android SDK (project-local)
        run: mise run setup-android

      - name: Restore production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UUKANSHU_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "UUKANSHU_KEYSTORE_BASE64 secret is empty"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/prod.keystore"
          chmod 600 "$GITHUB_WORKSPACE/prod.keystore"

      - name: Unit tests
        env:
          # Gradle resolves the release signingConfig at configuration time,
          # even for testDebugUnitTest, so the keystore must exist here too.
          UUKANSHU_KEYSTORE_FILE: ${{ github.workspace }}/prod.keystore
          UUKANSHU_KEYSTORE_PASSWORD: ${{ secrets.UUKANSHU_KEYSTORE_PASSWORD }}
          UUKANSHU_KEY_ALIAS: uukanshu
          UUKANSHU_KEY_PASSWORD: ${{ secrets.UUKANSHU_KEY_PASSWORD }}
        run: mise run test

      - name: Unit tests green
        run: |
          set -e
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          assert files, 'no test result XML found'
          t = f = e = 0
          for x in files:
              r = ET.parse(x).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)); e += int(r.get('errors', 0))
          print(f'tests={t} failures={f} errors={e}')
          assert t > 0 and f == 0 and e == 0, 'unit tests are not green'
          EOF

      - name: Build release APK
        env:
          UUKANSHU_KEYSTORE_FILE: ${{ github.workspace }}/prod.keystore
          UUKANSHU_KEYSTORE_PASSWORD: ${{ secrets.UUKANSHU_KEYSTORE_PASSWORD }}
          UUKANSHU_KEY_ALIAS: uukanshu
          UUKANSHU_KEY_PASSWORD: ${{ secrets.UUKANSHU_KEY_PASSWORD }}
        run: mise run build

      - name: Verify updater contract + official signature
        run: |
          set -e
          VER="${TAG#v}"
          # Tag must equal versionName (updater contract: tag vX.Y.Z == X.Y.Z).
          NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$NAME" = "$VER" || { echo "versionName $NAME != tag $VER"; exit 1; }
          # Exactly one asset with the exact updater-mandated name.
          APK="app/build/outputs/apk/release/uukanshu-$VER.apk"
          test -f "$APK" || { echo "missing $APK"; exit 1; }
          export ANDROID_SDK_ROOT="$PWD/.android-sdk"
          APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "apksigner not found under $ANDROID_SDK_ROOT/build-tools"; exit 1; }
          "$APKSIGNER" verify "$APK"
          # Signer must be the official production key — a dev-key build
          # can never slip into a release, even if secrets get miswired.
          # Exactly one signer: --print-certs prints one SHA-256 digest
          # line per signer, so a second stacked signature fails closed.
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          test "$(printf '%s' "$CERTS" | grep -c -i 'SHA-256 digest')" = 1 \
            || { echo "expected exactly 1 signer"; exit 1; }
          FP="$(printf '%s' "$CERTS" | grep -i 'SHA-256 digest' | head -n 1)"
          echo "$FP" | grep -qi "$EXPECTED_FINGERPRINT" \
            || { echo "signer is NOT the official production key"; exit 1; }
          # The tag must be annotated: its message is the user-facing
          # changelog (Traditional Chinese). A lightweight tag would leak
          # the bump commit message into the release notes instead.
          test "$(git cat-file -t "$TAG")" = tag \
            || { echo "tag $TAG is lightweight; re-tag annotated (-a) with the changelog"; exit 1; }
          # Tag message as release notes, minus any GPG armor. Uses git's
          # own subject/body split, so nothing matches literal `-----`
          # that could rot if the armor header ever varies.
          SUBJECT="$(git tag -l --format='%(subject)' "$TAG")"
          BODY="$(git tag -l --format='%(body)' "$TAG")"
          if [ -n "$BODY" ]; then
            printf -v NOTES '%s\n\n%s' "$SUBJECT" "$BODY"
          else
            NOTES="$SUBJECT"
          fi
          printf '%s' "$NOTES" | grep -q '[^[:space:]]' \
            || { echo "tag $TAG has an empty message; re-tag annotated with the changelog"; exit 1; }
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Fails if the release already exists — by design, assets are
        # never overwritten (see docs/RELEASING.md updater contract).
        # Finals: no explicit --latest, gh picks it by date+version, so backport
        # tags can never steal "latest" from a newer release. Prereleases are
        # pinned to --latest=false: a candidate must never be /releases/latest,
        # not even briefly.
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Confirm digest exposure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="${TAG#v}"
          EXPECTED_APK="uukanshu-$VER.apk"
          for i in 1 2 3 4 5 6; do
            if gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
                --jq '.assets' > "$RUNNER_TEMP/assets.json"; then
              if python3 - "$RUNNER_TEMP/assets.json" "$EXPECTED_APK" <<'EOF'; then
          import json, sys
          assets_path, expected = sys.argv[1], sys.argv[2]
          assets = json.load(open(assets_path))
          assert len(assets) == 1, f'expected exactly 1 asset, got {assets}'
          a = assets[0]
          assert a.get('name') == expected, f'name mismatch: {a}'
          assert (a.get('digest') or '').startswith('sha256:'), f'digest missing: {a}'
          print(a['name'], a['digest'])
          EOF
                exit 0
              fi
            fi
            echo "digest not ready (attempt $i/6), retrying..."
            sleep 10
          done
          echo "digest never appeared for $TAG/$EXPECTED_APK"; exit 1
